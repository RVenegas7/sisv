version: '3.8'

services:
  db:
    image: postgres:18.6-alpine
    container_name: sis_postgres_dev
    restart: always
    environment:
      POSTGRES_DB: sis_salud_db
      POSTGRES_USER: sis_user
      POSTGRES_PASSWORD: sis_password
      TZ: America/Caracas
    ports:
      - "5436:5432"
    volumes:
      - sis_postgres_data:/var/lib/postgresql

volumes:
  sis_postgres_data:
