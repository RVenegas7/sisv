version: '3.8'

# Despliegue de SISV con Docker.
#
# Este equipo NO tiene el plugin `docker compose` (solo el binario `docker`), así que la
# vía real es `./docker/levantar.sh` (docker build + docker run). Este archivo queda como
# documentación equivalente y para equipos que sí tengan compose:
#
#   docker compose up -d --build
#
# La base de datos NO se define aquí a propósito: es el contenedor `sis_postgres_dev`
# (puerto 5436) con su volumen `sis_postgres_data`, donde vive la data real y el espejo
# `sismai`. Ese contenedor ya corre con `--restart always`; definirlo otra vez aquí
# chocaría con el nombre y, si se recreara, arrancaría con un volumen vacío.

services:
  app:
    build: .
    image: sisv:latest
    container_name: sisv_app
    restart: always
    env_file:
      - docker/sisv.env
    ports:
      - "8020:8000"
    # En Linux, permite llegar al PostgreSQL que corre en el host (DB_HOST=host.docker.internal).
    extra_hosts:
      - "host.docker.internal:host-gateway"
